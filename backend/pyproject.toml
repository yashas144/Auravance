[project]
name = "auravance-backend"
version = "0.1.0"
description = "Backend foundation for Auravance predictive maintenance platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "openai>=1.0.0",
  "joblib>=1.4.2",
  "pandas>=2.2.3",
  "pypdf>=4.3.1",
  "py7zr>=0.22.0",
  "scikit-learn>=1.5.2",
  "uvicorn[standard]>=0.30.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
